<script>

/* =========================================================
   1. ETF 数据地址
   =========================================================

   直接使用网站根目录下的绝对路径。

   JSON 文件：

   /assets/data/etf_data.json

   这样不会因为当前页面位于 /market/
   而错误请求：

   /market/assets/data/etf_data.json
   */

const DATA_URL = "/assets/data/etf_data.json";


/* =========================================================
   2. 排序状态
   ========================================================= */

let currentSort = {

  key: null,

  direction: "desc"

};


/* =========================================================
   3. 保存原始数据
   ========================================================= */

let originalData = [];


/* =========================================================
   4. 百分比格式化
   ========================================================= */

function formatPercent(value) {

  if (
    value === null ||
    value === undefined ||
    value === "" ||
    isNaN(Number(value))
  ) {

    return "--";

  }


  const num = Number(value);


  if (num > 0) {

    return `
      <span class="positive">
        +${num.toFixed(2)}%
      </span>
    `;

  }


  if (num < 0) {

    return `
      <span class="negative">
        ${num.toFixed(2)}%
      </span>
    `;

  }


  return `
    <span class="zero">
      0.00%
    </span>
  `;

}


/* =========================================================
   5. 数字格式化
   ========================================================= */

function formatNumber(value, digits = 3) {

  if (
    value === null ||
    value === undefined ||
    value === "" ||
    isNaN(Number(value))
  ) {

    return "--";

  }


  return Number(value).toFixed(digits);

}


/* =========================================================
   6. 安全显示文字
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================================================
   7. 排序数据
   ========================================================= */

function sortData(data, key) {

  /*
   * 点击当前列：
   *
   * desc → asc
   * asc  → desc
   */

  if (currentSort.key === key) {

    currentSort.direction =
      currentSort.direction === "desc"
        ? "asc"
        : "desc";

  }

  /*
   * 点击新列：
   *
   * 默认降序
   */

  else {

    currentSort.key = key;

    currentSort.direction = "desc";

  }


  const direction =
    currentSort.direction;


  /*
   * 创建副本进行排序
   *
   * 不修改 originalData
   */

  return [...data].sort((a, b) => {

    const valueA = Number(a[key]);

    const valueB = Number(b[key]);


    /*
     * 两个都没有数据
     */

    if (
      isNaN(valueA) &&
      isNaN(valueB)
    ) {

      return 0;

    }


    /*
     * A 没数据 → 放最后
     */

    if (isNaN(valueA)) {

      return 1;

    }


    /*
     * B 没数据 → 放最后
     */

    if (isNaN(valueB)) {

      return -1;

    }


    /*
     * 降序
     */

    if (direction === "desc") {

      return valueB - valueA;

    }


    /*
     * 升序
     */

    return valueA - valueB;

  });

}


/* =========================================================
   8. 更新排序箭头
   ========================================================= */

function updateSortIndicators() {

  document
    .querySelectorAll(".sortable")
    .forEach(th => {

      const key =
        th.dataset.sort;


      const arrow =
        th.querySelector(".sort-arrow");


      if (!arrow) {

        return;

      }


      /*
       * 清空箭头
       */

      arrow.textContent = "";


      /*
       * 当前排序列显示箭头
       */

      if (currentSort.key === key) {

        arrow.textContent =
          currentSort.direction === "desc"
            ? " ↓"
            : " ↑";

      }

    });

}


/* =========================================================
   9. 渲染表格
   ========================================================= */

function renderTable(data) {

  const tbody =
    document.getElementById("etf-body");


  /*
   * 检查 tbody
   */

  if (!tbody) {

    console.error(
      "找不到 #etf-body"
    );

    return;

  }


  /*
   * 没有数据
   */

  if (
    !Array.isArray(data) ||
    data.length === 0
  ) {

    tbody.innerHTML = `

      <tr>

        <td
          colspan="11"
          class="error"
        >

          暂无 ETF 数据

        </td>

      </tr>

    `;

    return;

  }


  /*
   * 生成 ETF 表格
   */

  tbody.innerHTML = data.map(item => {

    return `

      <tr>

        <!-- 当前回撤 -->

        <td>
          ${formatPercent(item.current_drawdown)}
        </td>


        <!-- ETF代码 -->

        <td class="etf-code">
          ${escapeHTML(item.code || "--")}
        </td>


        <!-- ETF名称 -->

        <td class="etf-name">
          ${escapeHTML(item.name || "--")}
        </td>


        <!-- 最新价格 -->

        <td class="price">
          ${formatNumber(item.price, 3)}
        </td>


        <!-- 今日涨跌幅 -->

        <td>
          ${formatPercent(item.change_1d)}
        </td>


        <!-- 近1周涨跌幅 -->

        <td>
          ${formatPercent(item.change_1w)}
        </td>


        <!-- 近1月涨跌幅 -->

        <td>
          ${formatPercent(item.change_1m)}
        </td>


        <!-- 最近最高点 -->

        <td>
          ${formatNumber(item.recent_high, 3)}
        </td>


        <!-- 最近最低点 -->

        <td>
          ${formatNumber(item.recent_low, 3)}
        </td>


        <!-- 最大回撤 -->

        <td>
          ${formatPercent(item.max_drawdown)}
        </td>


        <!-- 平均回撤 -->

        <td>
          ${formatPercent(item.average_drawdown)}
        </td>

      </tr>

    `;

  }).join("");


  /*
   * 更新排序箭头
   */

  updateSortIndicators();

}


/* =========================================================
   10. 加载 ETF 数据
   ========================================================= */

async function loadETFData() {

  const status =
    document.getElementById("status");


  const updateInfo =
    document.getElementById("update-info");


  try {

    /*
     * 加载提示
     */

    status.textContent =
      "正在加载 ETF 数据……";


    /*
     * 加入时间戳防止浏览器缓存
     */

    const url =
      DATA_URL +
      "?t=" +
      Date.now();


    console.log(
      "正在请求 ETF 数据：",
      url
    );


    /*
     * 请求 JSON
     */

    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    /*
     * 检查 HTTP 状态
     */

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        "：" +
        response.statusText
      );

    }


    /*
     * 解析 JSON
     */

    const json =
      await response.json();


    console.log(
      "ETF JSON 数据：",
      json
    );


    /* =====================================================
       11. 兼容两种 JSON 格式
       =====================================================

       第一种：

       {
         "data": [...]
       }

       第二种：

       [...]
       */

    let data = null;


    /*
     * 标准格式
     */

    if (
      json &&
      Array.isArray(json.data)
    ) {

      data = json.data;

    }


    /*
     * 如果 JSON 本身就是数组
     */

    else if (
      Array.isArray(json)
    ) {

      data = json;

    }


    /*
     * 数据格式错误
     */

    else {

      throw new Error(
        "JSON 数据格式不正确，找不到 data 数组"
      );

    }


    /*
     * 保存原始数据
     */

    originalData =
      data;


    /*
     * 首次加载：
     * 保持 Python 生成的原始顺序
     */

    renderTable(
      originalData
    );


    /* =====================================================
       12. 统计信息
       ===================================================== */

    const count =
      json.count !== undefined
        ? json.count
        : data.length;


    const success =
      json.success !== undefined
        ? json.success
        : data.length;


    const failed =
      json.failed !== undefined
        ? json.failed
        : 0;


    status.innerHTML = `

      共监控
      <strong>
        ${count}
      </strong>
      只 ETF，

      成功
      <strong>
        ${success}
      </strong>
      只，

      失败
      <strong>
        ${failed}
      </strong>
      只

    `;


    /* =====================================================
       13. 更新时间
       ===================================================== */

    if (
      json.updated_at
    ) {

      updateInfo.textContent =
        "数据更新时间：" +
        json.updated_at +
        "　数据来源：" +
        (
          json.source ||
          "Tencent Finance"
        );

    }

    else {

      updateInfo.textContent =
        "数据来源：" +
        (
          json.source ||
          "Tencent Finance"
        );

    }


    /*
     * 控制台提示加载成功
     */

    console.log(
      "ETF 数据加载成功，共",
      data.length,
      "只"
    );

  }


  catch (error) {

    /*
     * 控制台输出完整错误
     */

    console.error(
      "ETF 数据加载失败：",
      error
    );


    /*
     * 页面状态
     */

    status.textContent =
      "ETF 数据加载失败";


    /*
     * 显示错误原因
     */

    document
      .getElementById("etf-body")
      .innerHTML = `

        <tr>

          <td
            colspan="11"
            class="error"
          >

            数据加载失败：
            ${escapeHTML(error.message)}

          </td>

        </tr>

      `;


    /*
     * 更新时间区域
     */

    updateInfo.textContent =
      "数据文件：" +
      DATA_URL;

  }

}


/* =========================================================
   14. 绑定排序
   ========================================================= */

function bindSortEvents() {

  document
    .querySelectorAll(".sortable")
    .forEach(th => {

      th.addEventListener(
        "click",
        () => {

          /*
           * 获取排序字段
           */

          const key =
            th.dataset.sort;


          /*
           * 防止错误字段
           */

          if (!key) {

            return;

          }


          /*
           * 排序
           */

          const sortedData =
            sortData(
              originalData,
              key
            );


          /*
           * 重新渲染
           */

          renderTable(
            sortedData
          );


          /*
           * 更新提示
           */

          const status =
            document.getElementById("status");


          if (status) {

            const directionText =
              currentSort.direction === "desc"
                ? "从高到低"
                : "从低到高";


            status.innerHTML = `

              共监控
              <strong>
                ${originalData.length}
              </strong>
              只 ETF，

              当前按
              <strong>
                ${th.textContent.replace(/[↓↑]/g, "").trim()}
              </strong>

              ${directionText}

            `;

          }

        }
      );

    });

}


/* =========================================================
   15. 页面加载
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    /*
     * 绑定排序按钮
     */

    bindSortEvents();


    /*
     * 加载 ETF 数据
     */

    loadETFData();

  }
);

</script>
