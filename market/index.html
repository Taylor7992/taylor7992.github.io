<script>

const DATA_URL = "/assets/data/etf_data.json";

let etfData = [];

let currentPeriod = "change_1d";

let sortKey = "current_drawdown";
let sortDesc = true;


/* ---------- 基础格式 ---------- */

function number(value, digits = 2) {
  const n = Number(value);
  return Number.isFinite(n) ? n.toFixed(digits) : "-";
}

function percent(value) {
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "-";
  }

  return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
}

function amount(value) {
  const n = Number(value);

  if (!Number.isFinite(n) || n <= 0) {
    return "暂无";
  }

  if (n >= 100000000) {
    return (n / 100000000).toFixed(2) + " 亿";
  }

  if (n >= 10000) {
    return (n / 10000).toFixed(0) + " 万";
  }

  return Math.round(n).toLocaleString();
}

function safe(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}


/* ---------- 涨跌颜色 ---------- */

function textClass(value) {
  const n = Number(value);

  if (n > 0) return "text-up";
  if (n < 0) return "text-down";

  return "text-neutral";
}

function heatClass(value) {
  const n = Number(value);

  if (!Number.isFinite(n) || n === 0) {
    return "neutral";
  }

  if (n > 0) {
    if (n >= 5) return "up-5";
    if (n >= 3) return "up-4";
    if (n >= 1.5) return "up-3";
    if (n >= 0.5) return "up-2";
    return "up-1";
  }

  if (n <= -5) return "down-5";
  if (n <= -3) return "down-4";
  if (n <= -1.5) return "down-3";
  if (n <= -0.5) return "down-2";

  return "down-1";
}


/* ---------- 获取对应周期成交额 ---------- */

function getAmount(item) {

  if (currentPeriod === "change_1d") {
    return Number(item.amount_1d) || Number(item.amount_today) || Number(item.amount) || 0;
  }

  if (currentPeriod === "change_1w") {
    return Number(item.amount_1w) || Number(item.amount_week) || Number(item.amount) || 0;
  }

  if (currentPeriod === "change_1m") {
    return Number(item.amount_1m) || Number(item.amount_month) || Number(item.amount) || 0;
  }

  return Number(item.amount) || 0;
}


/* ---------- 热力图 ---------- */

function renderHeatmap() {

  const box = document.getElementById("heatmap");

  if (!etfData.length) {
    box.innerHTML = "暂无数据";
    return;
  }


  /*
   按当前周期成交额排序
  */
  const data = etfData
    .map(item => ({
      item: item,
      amount: getAmount(item)
    }))
    .sort((a, b) => b.amount - a.amount);


  /*
   桌面端 4 列，小屏幕减少列数
  */
  let columnCount = 4;

  if (window.innerWidth < 700) {
    columnCount = 2;
  } else if (window.innerWidth < 1100) {
    columnCount = 3;
  }


  const columns = [];

  for (let i = 0; i < columnCount; i++) {
    columns.push({
      items: [],
      total: 0
    });
  }


  /*
   尽量让每一列成交额接近
  */
  data.forEach(entry => {

    let target = columns[0];

    for (const column of columns) {
      if (column.total < target.total) {
        target = column;
      }
    }

    target.items.push(entry);
    target.total += entry.amount;

  });


  const totalAmount = data.reduce(
    (sum, item) => sum + item.amount,
    0
  );


  box.innerHTML = "";


  columns.forEach(column => {

    if (!column.items.length) {
      return;
    }


    const columnElement =
      document.createElement("div");

    columnElement.className =
      "heat-column";


    /*
     每列宽度也根据成交额决定
    */
    const columnWidth =
      totalAmount > 0
        ? column.total / totalAmount * 100
        : 100 / columnCount;

    columnElement.style.width =
      columnWidth + "%";


    column.items.forEach(entry => {

      const item = entry.item;

      const tile =
        document.createElement("div");

      tile.className =
        "heat-item " +
        heatClass(item[currentPeriod]);


      /*
       方块高度 = ETF成交额 / 当前列成交额
      */
      const height =
        column.total > 0
          ? entry.amount / column.total * 100
          : 0;

      tile.style.height =
        height + "%";


      tile.innerHTML = `
        <div class="heat-name">
          ${safe(item.name || item.code)}
        </div>

        <div class="heat-code">
          ${safe(item.code)}
        </div>

        <div class="heat-change">
          ${percent(item[currentPeriod])}
        </div>
      `;


      /*
       鼠标提示显示当前周期成交额
      */
      tile.title =
        `${item.name || item.code}
代码：${item.code}
${getPeriodName()}涨跌幅：${percent(item[currentPeriod])}
${getPeriodName()}成交额：${amount(entry.amount)}`;


      columnElement.appendChild(tile);

    });


    box.appendChild(columnElement);

  });

}


/* ---------- 周期名称 ---------- */

function getPeriodName() {

  if (currentPeriod === "change_1w") {
    return "近1周";
  }

  if (currentPeriod === "change_1m") {
    return "近1月";
  }

  return "今日";
}


/* ---------- 数据表 ---------- */

function renderTable() {

  const body =
    document.getElementById("etfTableBody");

  const data = [...etfData];


  data.sort((a, b) => {

    let av = a[sortKey];
    let bv = b[sortKey];


    if (sortKey === "code") {

      av = String(av || "");
      bv = String(bv || "");

      return sortDesc
        ? bv.localeCompare(av)
        : av.localeCompare(bv);

    }


    if (sortKey === "name") {

      av = String(av || "");
      bv = String(bv || "");

      return sortDesc
        ? bv.localeCompare(av, "zh-CN")
        : av.localeCompare(bv, "zh-CN");

    }


    av = Number(av);
    bv = Number(bv);


    if (!Number.isFinite(av)) return 1;
    if (!Number.isFinite(bv)) return -1;


    return sortDesc
      ? bv - av
      : av - bv;

  });


  body.innerHTML = "";


  data.forEach(item => {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td class="${textClass(item.current_drawdown)}">
        ${percent(item.current_drawdown)}
      </td>

      <td>
        ${safe(item.code)}
      </td>

      <td>
        ${safe(item.name || "-")}
      </td>

      <td>
        ${number(item.price, 4)}
      </td>

      <td class="${textClass(item.change_1d)}">
        ${percent(item.change_1d)}
      </td>

      <td class="${textClass(item.change_1w)}">
        ${percent(item.change_1w)}
      </td>

      <td class="${textClass(item.change_1m)}">
        ${percent(item.change_1m)}
      </td>

      <td>
        ${number(item.recent_high, 4)}
      </td>

      <td>
        ${number(item.recent_low, 4)}
      </td>

      <td class="${textClass(item.max_drawdown)}">
        ${percent(item.max_drawdown)}
      </td>

      <td class="${textClass(item.average_drawdown)}">
        ${percent(item.average_drawdown)}
      </td>

    `;


    body.appendChild(row);

  });


  updateSortArrow();

}


/* ---------- 排序箭头 ---------- */

function updateSortArrow() {

  document
    .querySelectorAll(".etf-table th")
    .forEach(th => {

      const arrow =
        th.querySelector(".sort-arrow");

      if (!arrow) return;


      if (th.dataset.sort === sortKey) {

        arrow.textContent =
          sortDesc ? "↓" : "↑";

      } else {

        arrow.textContent = "";

      }

    });

}


/* ---------- 表头点击排序 ---------- */

document
  .querySelectorAll(".etf-table th[data-sort]")
  .forEach(th => {

    th.addEventListener("click", () => {

      const key = th.dataset.sort;


      if (key === sortKey) {

        sortDesc = !sortDesc;

      } else {

        sortKey = key;
        sortDesc = true;

      }


      renderTable();

    });

  });


/* ---------- 周期切换 ---------- */

document
  .querySelectorAll(".period-btn")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".period-btn")
        .forEach(btn => {
          btn.classList.remove("active");
        });


      button.classList.add("active");

      currentPeriod =
        button.dataset.period;


      renderHeatmap();

    });

  });


/* ---------- 加载 JSON ---------- */

async function loadData() {

  try {

    const response =
      await fetch(
        DATA_URL + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }


    const json =
      await response.json();


    if (Array.isArray(json)) {

      etfData = json;

    } else if (Array.isArray(json.data)) {

      etfData = json.data;

    } else {

      throw new Error(
        "JSON 数据格式错误"
      );

    }


    if (!etfData.length) {
      throw new Error("没有 ETF 数据");
    }


    document.getElementById(
      "updateTime"
    ).textContent =
      json.updated_at
        ? "数据更新时间：" + json.updated_at
        : "数据更新时间：未知";


    renderHeatmap();
    renderTable();


  } catch (error) {

    console.error(error);


    document.getElementById(
      "heatmap"
    ).innerHTML =
      "数据加载失败：" + safe(error.message);


    document.getElementById(
      "etfTableBody"
    ).innerHTML = `
      <tr>
        <td colspan="11"
            style="text-align:center;padding:30px;">
          数据加载失败：${safe(error.message)}
        </td>
      </tr>
    `;


    document.getElementById(
      "updateTime"
    ).textContent =
      "数据加载失败";

  }

}


loadData();


/* 窗口大小变化时重新计算热力图 */

let resizeTimer;

window.addEventListener("resize", () => {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {
    renderHeatmap();
  }, 200);

});

</script>
