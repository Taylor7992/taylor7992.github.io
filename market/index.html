---
layout: single
title: "ETF 自选监控"
permalink: /market/
---

<style>
/* =========================================================
   ETF 监控页面
   ========================================================= */

.etf-page {
  width: 100%;
  max-width: 1800px;
  margin: 0 auto;
  padding: 0 16px 40px;
  box-sizing: border-box;
}

.etf-title {
  margin-bottom: 6px;
}

.etf-desc {
  color: #888;
  margin-bottom: 14px;
}

/* =========================================================
   顶部按钮
   ========================================================= */

.period-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.period-btn {
  border: 1px solid #3a3a3a;
  background: #202020;
  color: #bbb;
  padding: 7px 18px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}

.period-btn:hover {
  background: #303030;
  color: #fff;
}

.period-btn.active {
  background: #555;
  color: #fff;
  border-color: #777;
}

/* =========================================================
   主体布局
   ========================================================= */

.market-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(650px, 1.2fr);
  gap: 14px;
  align-items: start;
}

/* =========================================================
   热力图
   ========================================================= */

.heatmap-box {
  background: #111;
  border: 1px solid #303030;
  border-radius: 6px;
  padding: 10px;
  box-sizing: border-box;
  height: 680px;
  overflow: hidden;
}

.heatmap-title {
  color: #ddd;
  font-size: 14px;
  margin: 2px 4px 9px;
}

.heatmap {
  width: 100%;
  height: calc(100% - 34px);
  display: flex;
  gap: 4px;
  overflow: hidden;
}

.heat-column {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.heat-tile {
  position: relative;
  min-width: 0;
  min-height: 28px;
  overflow: hidden;
  border-radius: 3px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  cursor: pointer;
  transition: transform 0.12s ease, filter 0.12s ease;
  box-sizing: border-box;
}

.heat-tile:hover {
  transform: scale(1.015);
  filter: brightness(1.15);
  z-index: 5;
}

.heat-name {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  padding: 7px 7px 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.heat-code {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.78);
  padding: 0 7px;
}

.heat-change {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  padding: 3px 7px;
}

.heat-small .heat-name {
  font-size: 11px;
  padding: 4px;
}

.heat-small .heat-code {
  display: none;
}

.heat-small .heat-change {
  font-size: 12px;
  padding: 2px 4px;
}

/* =========================================================
   热力图颜色
   红 = 涨
   绿 = 跌
   ========================================================= */

.heat-up-1 {
  background: #6b2424;
}

.heat-up-2 {
  background: #8e2929;
}

.heat-up-3 {
  background: #b53232;
}

.heat-up-4 {
  background: #d43b3b;
}

.heat-up-5 {
  background: #ef4444;
}

.heat-down-1 {
  background: #245b3b;
}

.heat-down-2 {
  background: #247044;
}

.heat-down-3 {
  background: #27834d;
}

.heat-down-4 {
  background: #299957;
}

.heat-down-5 {
  background: #20b15d;
}

.heat-neutral {
  background: #555;
}

/* =========================================================
   表格
   ========================================================= */

.table-box {
  background: #111;
  border: 1px solid #303030;
  border-radius: 6px;
  overflow: hidden;
}

.table-wrap {
  height: 680px;
  overflow-y: auto;
  overflow-x: auto;
}

.etf-table {
  width: 100%;
  min-width: 1080px;
  border-collapse: collapse;
  color: #ddd;
  font-size: 13px;
}

.etf-table th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: #202020;
  color: #bbb;
  font-weight: 600;
  padding: 10px 8px;
  border-bottom: 1px solid #444;
  white-space: nowrap;
  cursor: pointer;
}

.etf-table td {
  padding: 9px 8px;
  border-bottom: 1px solid #282828;
  white-space: nowrap;
}

.etf-table tbody tr:hover {
  background: #1d1d1d;
}

.etf-table th:first-child,
.etf-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 2;
  background: #151515;
}

.etf-table th:first-child {
  z-index: 4;
  background: #202020;
}

.etf-table tbody tr:hover td:first-child {
  background: #1d1d1d;
}

.sort-arrow {
  margin-left: 3px;
  color: #888;
}

.sort-active {
  color: #fff;
}

/* 涨跌颜色 */

.up {
  color: #ff4d4d;
  font-weight: 600;
}

.down {
  color: #39c878;
  font-weight: 600;
}

.neutral {
  color: #aaa;
}

/* =========================================================
   更新时间
   ========================================================= */

.update-info {
  color: #777;
  font-size: 12px;
  margin: 8px 2px 12px;
}

/* =========================================================
   加载和错误
   ========================================================= */

.loading,
.error {
  padding: 30px;
  text-align: center;
  color: #888;
}

.error {
  color: #e66;
}

/* =========================================================
   手机端
   ========================================================= */

@media (max-width: 1100px) {

  .market-layout {
    grid-template-columns: 1fr;
  }

  .heatmap-box {
    height: 560px;
  }

  .table-wrap {
    height: 620px;
  }
}

@media (max-width: 700px) {

  .etf-page {
    padding-left: 8px;
    padding-right: 8px;
  }

  .heatmap-box {
    height: 520px;
  }

  .heatmap {
    gap: 3px;
  }

  .heat-column {
    gap: 3px;
  }

  .heat-name {
    font-size: 11px;
    padding: 4px;
  }

  .heat-change {
    font-size: 12px;
    padding: 2px 4px;
  }

  .period-btn {
    padding: 6px 13px;
  }

  .table-wrap {
    height: 560px;
  }
}
</style>


<div class="etf-page">

  <h1 class="etf-title">ETF 自选监控</h1>

  <div class="etf-desc">
    成交额热力图 · 收益率 · 历史回撤
  </div>

  <div id="updateInfo" class="update-info">

  </div>

  <!-- 热力图周期选择 -->
  <div class="period-buttons">

    <button
      class="period-btn active"
      data-period="change_1d">

    <button
      class="period-btn"

    </button>

    <button
      class="period-btn"

    </button>

  </div>


  <!-- 热力图 + 数据表 -->
  <div class="market-layout">

    <!-- =====================================================
         左侧热力图
         ===================================================== -->

    <div class="heatmap-box">

      <div class="heatmap-title">
        ETF 热力图 · 面积 = 成交额 · 颜色 = 涨跌幅
      </div>

      <div
        id="heatmap"

      </div>

    <!-- =====================================================

         ===================================================== -->

    <div class="table-box">

      <div

          class="etf-table">

          <thead>

            <tr>

              <th data-sort="current_drawdown">
                当前回撤
                <span class="sort-arrow"></span>
              </th>

              <th data-sort="code">
                ETF代码
                <span class="sort-arrow"></span>
              </th>

              <th data-sort="name">
                ETF名称
                <span class="sort-arrow"></span>
              </th>

              <th data-sort="price">
                最新价格
                <span class="sort-arrow"></span>
              </th>

              <th data-sort="change_1d">

                <span class="sort-arrow"></span>
              </th>

              <th data-sort="change_1w">
                近1周涨跌幅
                <span class="sort-arrow"></span>
              </th>

              <th data-sort="change_1m">

                <span class="sort-arrow"></span>
              </th>

              <th data-sort="recent_high">

                <span class="sort-arrow"></span>

                <span class="sort-arrow"></span>

                <span class="sort-arrow"></span>
              </th>

          </thead>

            <tr>

                数据加载中...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<script>
/* =========================================================
   ETF 数据
   ========================================================= */

const DATA_URL = "/assets/data/etf_data.json";

let originalData = [];

let currentSort = "current_drawdown";

let sortDirection = "desc";

let heatmapPeriod = "change_1d";


/* =========================================================
   基础格式
   ========================================================= */

function formatNumber(value, digits = 2) {

  const num = Number(value);

  if (!Number.isFinite(num)) {
    return "-";
  }

  return num.toFixed(digits);
}


function formatPercent(value) {

  const num = Number(value);

  if (!Number.isFinite(num)) {
    return "-";
  }

  return `${num >= 0 ? "+" : ""}${num.toFixed(2)}%`;
}


function formatAmount(value) {

  const num = Number(value);

  if (!Number.isFinite(num) || num <= 0) {
    return "暂无";
  }

  if (num >= 100000000) {

    return (
      (num / 100000000).toFixed(2)
      + " 亿"
    );

  }

  if (num >= 10000) {

    return (
      (num / 10000).toFixed(0)
      + " 万"
    );

  }

  return num.toFixed(0);
}


/* =========================================================
   防止特殊字符破坏页面
   ========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   涨跌颜色
   ========================================================= */

function getChangeClass(value) {

  const num = Number(value);

  if (!Number.isFinite(num)) {
    return "neutral";
  }

  if (num > 0) {
    return "up";
  }

  if (num < 0) {
    return "down";
  }

  return "neutral";
}


/* =========================================================
   热力图颜色
   ========================================================= */

function getHeatClass(value) {

  const num = Number(value);

  if (!Number.isFinite(num)) {
    return "heat-neutral";
  }

  if (num > 0) {

    if (num >= 5) return "heat-up-5";
    if (num >= 3) return "heat-up-4";
    if (num >= 1.5) return "heat-up-3";
    if (num >= 0.5) return "heat-up-2";

    return "heat-up-1";
  }

  if (num < 0) {

    if (num <= -5) return "heat-down-5";
    if (num <= -3) return "heat-down-4";
    if (num <= -1.5) return "heat-down-3";
    if (num <= -0.5) return "heat-down-2";

    return "heat-down-1";
  }

  return "heat-neutral";
}


/* =========================================================
   热力图显示数值
   ========================================================= */

function getHeatPeriodName() {

  if (heatmapPeriod === "change_1w") {
    return "1周";
  }

  if (heatmapPeriod === "change_1m") {
    return "1月";
  }

  return "今日";
}


/* =========================================================
   热力图
   ========================================================= */

function renderHeatmap() {

  const container =
    document.getElementById("heatmap");

  if (!container) {
    return;
  }

  container.innerHTML = "";

  if (!originalData.length) {

    container.innerHTML =
      '<div class="error">暂无数据</div>';

    return;
  }


  /* 按成交额从大到小排列 */

  const data = [...originalData]
    .filter(item => item && item.code)
    .sort((a, b) => {

      const amountA =
        Number(a.amount) || 0;

      const amountB =
        Number(b.amount) || 0;

      return amountB - amountA;

    });


  if (!data.length) {

    container.innerHTML =
      '<div class="error">暂无热力图数据</div>';

    return;
  }


  /* =======================================================
     根据屏幕宽度决定列数
     ======================================================= */

  let columnCount = 4;

  if (window.innerWidth < 700) {

    columnCount = 2;

  } else if (window.innerWidth < 1100) {

    columnCount = 3;

  }


  /* =======================================================
     把ETF分配到几个列
     ======================================================= */

  const columns = [];

  for (let i = 0; i < columnCount; i++) {

    columns.push({
      items: [],
      amount: 0
    });

  }


  /* 大成交额优先放到当前最小的列 */

  data.forEach(item => {

    let target = columns[0];

    columns.forEach(column => {

      if (column.amount < target.amount) {
        target = column;
      }

    });

    const amount =
      Math.max(
        Number(item.amount) || 0,
        1
      );

    target.items.push(item);

    target.amount += amount;

  });


  const totalAmount =
    columns.reduce(
      (sum, column) =>
        sum + column.amount,
      0
    );


  /* =======================================================
     创建列
     ======================================================= */

  columns.forEach(column => {

    if (!column.items.length) {
      return;
    }

    const columnElement =
      document.createElement("div");

    columnElement.className =
      "heat-column";


    /* 列宽根据成交额比例 */

    const width =
      totalAmount > 0
        ? column.amount / totalAmount * 100
        : 100 / columnCount;

    columnElement.style.width =
      `${width}%`;


    /* =====================================================
       创建每个方块
       ===================================================== */

    column.items.forEach(item => {

      const tile =
        document.createElement("div");

      tile.className =
        "heat-tile "
        + getHeatClass(
            item[heatmapPeriod]
          );


      const amount =
        Math.max(
          Number(item.amount) || 0,
          1
        );


      /* 当前列中的成交额占比 */

      const tileHeight =
        column.amount > 0
          ? amount / column.amount * 100
          : 100 / column.items.length;


      tile.style.height =
        `${Math.max(tileHeight, 5)}%`;


      const value =
        Number(
          item[heatmapPeriod]
        );


      const valueText =
        Number.isFinite(value)
          ? formatPercent(value)
          : "-";


      tile.innerHTML = `

        <div class="heat-name">
          ${escapeHTML(item.name || item.code)}
        </div>

        <div class="heat-code">
          ${escapeHTML(item.code)}
        </div>

        <div class="heat-change">
          ${valueText}
        </div>

      `;


      /* ===================================================
         鼠标悬停提示
         =================================================== */

      tile.title =
        `${item.name || item.code}
代码：${item.code}
${getHeatPeriodName()}：${valueText}
成交额：${formatAmount(item.amount)}
今日：${formatPercent(item.change_1d)}
1周：${formatPercent(item.change_1w)}
1月：${formatPercent(item.change_1m)}
当前回撤：${formatPercent(item.current_drawdown)}`;


      /* 太小的方块隐藏部分文字 */

      if (tileHeight < 9) {

        tile.classList.add(
          "heat-small"
        );

      }


      columnElement.appendChild(tile);

    });


    container.appendChild(
      columnElement
    );

  });

}


/* =========================================================
   表格排序
   ========================================================= */

function sortData(data) {

  const sorted =
    [...data];


  sorted.sort((a, b) => {

    const av = a[currentSort];

    const bv = b[currentSort];


    /* 字符串排序 */

    if (
      typeof av === "string"
      &&
      typeof bv === "string"
    ) {

      return (
        av.localeCompare(
          bv,
          "zh-CN"
        )
        *
        (
          sortDirection === "asc"
            ? 1
            : -1
        )
      );

    }


    /* 数字排序 */

    const aNum =
      Number(av);

    const bNum =
      Number(bv);


    if (!Number.isFinite(aNum)) {
      return 1;
    }

    if (!Number.isFinite(bNum)) {
      return -1;
    }


    return (
      (aNum - bNum)
      *
      (
        sortDirection === "asc"
          ? 1
          : -1
      )
    );

  });


  return sorted;
}


/* =========================================================
   表格
   ========================================================= */

function renderTable() {

  const tbody =
    document.getElementById(
      "etfBody"
    );

  if (!tbody) {
    return;
  }


  const data =
    sortData(originalData);


  tbody.innerHTML = "";


  data.forEach(item => {

    const tr =
      document.createElement("tr");


    tr.innerHTML = `

      <td class="${getChangeClass(item.current_drawdown)}">
        ${formatPercent(item.current_drawdown)}
      </td>

      <td>
        ${escapeHTML(item.code)}
      </td>

      <td>
        ${escapeHTML(item.name || "-")}
      </td>

      <td>
        ${formatNumber(item.price, 4)}
      </td>

      <td class="${getChangeClass(item.change_1d)}">
        ${formatPercent(item.change_1d)}
      </td>

      <td class="${getChangeClass(item.change_1w)}">
        ${formatPercent(item.change_1w)}
      </td>

      <td class="${getChangeClass(item.change_1m)}">
        ${formatPercent(item.change_1m)}
      </td>

      <td>
        ${formatNumber(item.recent_high, 4)}
      </td>

      <td>
        ${formatNumber(item.recent_low, 4)}
      </td>

      <td class="${getChangeClass(item.max_drawdown)}">
        ${formatPercent(item.max_drawdown)}
      </td>

      <td class="${getChangeClass(item.average_drawdown)}">
        ${formatPercent(item.average_drawdown)}
      </td>

    `;


    tbody.appendChild(tr);

  });


  updateSortHeader();

}


/* =========================================================
   更新排序箭头
   ========================================================= */

function updateSortHeader() {

  const headers =
    document.querySelectorAll(
      ".etf-table th"
    );


  headers.forEach(header => {

    const key =
      header.dataset.sort;

    const arrow =
      header.querySelector(
        ".sort-arrow"
      );


    if (!arrow) {
      return;
    }


    if (key === currentSort) {

      arrow.textContent =
        sortDirection === "asc"
          ? "↑"
          : "↓";

      arrow.classList.add(
        "sort-active"
      );

    } else {

      arrow.textContent =
        "";

      arrow.classList.remove(
        "sort-active"
      );

    }

  });

}


/* =========================================================
   点击表头排序
   ========================================================= */

document
  .querySelectorAll(
    ".etf-table th[data-sort]"
  )
  .forEach(header => {

    header.addEventListener(
      "click",
      () => {

        const key =
          header.dataset.sort;


        if (currentSort === key) {

          sortDirection =
            sortDirection === "asc"
              ? "desc"
              : "asc";

        } else {

          currentSort = key;

          sortDirection = "desc";

        }


        renderTable();

      }
    );

  });


/* =========================================================
   周期按钮
   ========================================================= */

document
  .querySelectorAll(
    ".period-btn"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            ".period-btn"
          )
          .forEach(btn => {

            btn.classList.remove(
              "active"
            );

          });


        button.classList.add(
          "active"
        );


        heatmapPeriod =
          button.dataset.period;


        renderHeatmap();

      }
    );

  });


/* =========================================================
   加载数据
   ========================================================= */

async function loadData() {

  const heatmap =
    document.getElementById(
      "heatmap"
    );

  const tbody =
    document.getElementById(
      "etfBody"
    );

  const updateInfo =
    document.getElementById(
      "updateInfo"
    );


  try {

    const response =
      await fetch(
        DATA_URL
        + "?t="
        + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const json =
      await response.json();


    /* 兼容两种JSON结构 */

    if (Array.isArray(json)) {

      originalData = json;

    } else if (
      Array.isArray(json.data)
    ) {

      originalData = json.data;

    } else {

      throw new Error(
        "JSON 数据格式错误"
      );

    }


    if (!originalData.length) {

      throw new Error(
        "没有ETF数据"
      );

    }


    /* 更新时间 */

    if (json.updated_at) {

      updateInfo.textContent =
        `数据更新时间：${json.updated_at}`;

    } else {

      updateInfo.textContent =
        "数据更新时间：未知";

    }


    renderHeatmap();

    renderTable();


  } catch (error) {

    console.error(
      "ETF数据加载失败：",
      error
    );


    heatmap.innerHTML = `
      <div class="error">
        ETF 数据加载失败<br>
        ${escapeHTML(error.message)}
      </div>
    `;


    tbody.innerHTML = `
      <tr>
        <td
          colspan="11"
          class="error">
          数据加载失败：${escapeHTML(error.message)}
        </td>
      </tr>
    `;


    updateInfo.textContent =
      "数据加载失败";

  }

}


/* =========================================================
   页面加载
   ========================================================= */

loadData();


/* =========================================================
   窗口大小变化
   ========================================================= */

let resizeTimer = null;

window.addEventListener(
  "resize",
  () => {

    clearTimeout(
      resizeTimer
    );

    resizeTimer =
      setTimeout(
        () => {

          renderHeatmap();

        },
        200
      );

  }
);
</script>
