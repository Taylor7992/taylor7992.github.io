<div class="etf-page">


  <!-- ==========================================================
       页面标题
       ========================================================== -->

  <div class="etf-header">

    <h1>ETF 自选监控</h1>

    <div class="etf-subtitle">
      自动更新 ETF 行情、收益率与回撤数据
    </div>

  </div>


  <!-- ==========================================================
       数据状态
       ========================================================== -->

  <div id="status" class="etf-status">
    正在加载数据……
  </div>


  <!-- ==========================================================
       ETF 表格
       ========================================================== -->

  <div class="table-wrapper">

    <table class="etf-table">

      <thead>

        <tr>

          <th>当前回撤</th>

          <th>ETF代码</th>

          <th>ETF名称</th>

          <th>最新价格</th>

          <th>今日涨跌幅</th>

          <th>近1周涨跌幅</th>

          <th>近1月涨跌幅</th>

          <th>最近最高点</th>

          <th>最近最低点</th>

          <th>最大回撤</th>

          <th>平均回撤</th>

        </tr>

      </thead>


      <tbody id="etf-body">

        <tr>

          <td colspan="11" class="loading">
            正在加载 ETF 数据……
          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- ==========================================================
       更新时间
       ========================================================== -->

  <div id="update-info" class="update-info"></div>


</div>


<script>


  // ============================================================
  // JSON 数据地址
  // ============================================================

  const DATA_URL =
    "{{ '/assets/data/etf_data.json' | relative_url }}";


  // ============================================================
  // 格式化百分比
  // ============================================================

  function formatPercent(value) {

    if (
      value === null ||
      value === undefined ||
      isNaN(value)
    ) {
      return "--";
    }

    const num = Number(value);


    if (num > 0) {

      return (
        '<span class="positive">+' +
        num.toFixed(2) +
        '%</span>'
      );

    }


    if (num < 0) {

      return (
        '<span class="negative">' +
        num.toFixed(2) +
        '%</span>'
      );

    }


    return (
      '<span class="zero">0.00%</span>'
    );

  }


  // ============================================================
  // 格式化数字
  // ============================================================

  function formatNumber(value, digits = 3) {

    if (
      value === null ||
      value === undefined ||
      isNaN(value)
    ) {
      return "--";
    }

    return Number(value).toFixed(digits);

  }


  // ============================================================
  // 创建 ETF 表格
  // ============================================================

  function renderTable(data) {

    const tbody =
      document.getElementById("etf-body");


    if (!data || data.length === 0) {

      tbody.innerHTML = `
        <tr>
          <td colspan="11" class="error">
            暂无 ETF 数据
          </td>
        </tr>
      `;

      return;

    }


    tbody.innerHTML = data.map(item => {

      return `

        <tr>

          <!-- 当前回撤 -->

          <td>
            ${formatPercent(item.current_drawdown)}
          </td>


          <!-- ETF代码 -->

          <td class="etf-code">
            ${item.code || "--"}
          </td>


          <!-- ETF名称 -->

          <td class="etf-name">
            ${item.name || "--"}
          </td>


          <!-- 最新价格 -->

          <td class="price">
            ${formatNumber(item.price, 3)}
          </td>


          <!-- 今日涨跌幅 -->

          <td>
            ${formatPercent(item.change_1d)}
          </td>


          <!-- 近1周涨跌幅 -->

          <td>
            ${formatPercent(item.change_1w)}
          </td>


          <!-- 近1月涨跌幅 -->

          <td>
            ${formatPercent(item.change_1m)}
          </td>


          <!-- 最近最高点 -->

          <td>
            ${formatNumber(item.recent_high, 3)}
          </td>


          <!-- 最近最低点 -->

          <td>
            ${formatNumber(item.recent_low, 3)}
          </td>


          <!-- 最大回撤 -->

          <td>
            ${formatPercent(item.max_drawdown)}
          </td>


          <!-- 平均回撤 -->

          <td>
            ${formatPercent(item.average_drawdown)}
          </td>

        </tr>

      `;

    }).join("");

  }


  // ============================================================
  // 加载 JSON 数据
  // ============================================================

  async function loadETFData() {

    const status =
      document.getElementById("status");

    const updateInfo =
      document.getElementById("update-info");


    try {

      status.textContent =
        "正在加载 ETF 数据……";


      const response = await fetch(
        DATA_URL + "?t=" + Date.now()
      );


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      const json =
        await response.json();


      // --------------------------------------------------------
      // 检查数据结构
      // --------------------------------------------------------

      if (
        !json.data ||
        !Array.isArray(json.data)
      ) {

        throw new Error(
          "JSON 数据格式不正确"
        );

      }


      // --------------------------------------------------------
      // 渲染表格
      // --------------------------------------------------------

      renderTable(json.data);


      // --------------------------------------------------------
      // 状态信息
      // --------------------------------------------------------

      const success =
        json.success ??
        json.data.length;

      const failed =
        json.failed ??
        0;


      status.innerHTML =

        `共监控 <strong>${json.count ?? json.data.length}</strong> 只 ETF，
         成功 <strong>${success}</strong> 只，
         失败 <strong>${failed}</strong> 只`;


      // --------------------------------------------------------
      // 更新时间
      // --------------------------------------------------------

      if (json.updated_at) {

        updateInfo.textContent =

          "数据更新时间：" +
          json.updated_at +
          "　数据来源：" +
          (json.source || "Tencent Finance");

      }

      else {

        updateInfo.textContent =

          "数据来源：" +
          (json.source || "Tencent Finance");

      }

    }


    catch (error) {

      console.error(
        "ETF 数据加载失败：",
        error
      );


      status.textContent =
        "ETF 数据加载失败";


      document.getElementById(
        "etf-body"
      ).innerHTML = `

        <tr>

          <td
            colspan="11"
            class="error"
          >
            数据加载失败：${error.message}
          </td>

        </tr>

      `;


      updateInfo.textContent =
        "请检查 assets/data/etf_data.json 是否正常生成。";

    }

  }


  // ============================================================
  // 页面加载
  // ============================================================

  document.addEventListener(
    "DOMContentLoaded",
    loadETFData
  );


</script>
