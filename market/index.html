<style>
.etf-dashboard {
  margin-top: 20px;
}

.etf-dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.etf-dashboard-header h2 {
  margin: 0;
  font-size: 1.6rem;
}

.etf-updated {
  color: #777;
  font-size: 0.9rem;
}

.etf-table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  background: #fff;
}

.etf-table {
  width: 100%;
  min-width: 1150px;
  border-collapse: collapse;
  font-size: 14px;
}

.etf-table th {
  padding: 12px 10px;
  background: #f5f6f7;
  border-bottom: 1px solid #ddd;
  white-space: nowrap;
  text-align: center;
  font-weight: 600;
}

.etf-table td {
  padding: 11px 10px;
  border-bottom: 1px solid #eee;
  white-space: nowrap;
  text-align: center;
}

.etf-table tbody tr:hover {
  background: #fafafa;
}

.etf-table tbody tr:last-child td {
  border-bottom: none;
}

.etf-code {
  font-family: monospace;
  font-weight: 600;
}

.etf-name {
  text-align: left !important;
  min-width: 190px;
}

.up {
  color: #d93025;
  font-weight: 600;
}

.down {
  color: #198754;
  font-weight: 600;
}

.neutral {
  color: #666;
}

.error-row {
  background: #fff8f8;
}

.error-text {
  color: #999;
  font-size: 12px;
}

.etf-loading,
.etf-error {
  padding: 30px !important;
  text-align: center !important;
  color: #777;
}

.etf-error {
  color: #d93025;
}
</style>

<div class="etf-dashboard">

  <div class="etf-dashboard-header">
    <h2>ETF 自选监控</h2>
    <div class="etf-updated" id="etf-updated">
      数据加载中...
    </div>
  </div>

  <div class="etf-table-wrap">

    <table class="etf-table">

      <thead>
        <tr>
          <th>当前回撤</th>
          <th>ETF代码</th>
          <th>ETF名称</th>
          <th>最新价格</th>
          <th>今日涨跌幅</th>
          <th>近1周涨跌幅</th>
          <th>近1月涨跌幅</th>
          <th>最近最高点</th>
          <th>最近最低点</th>
          <th>最大回撤</th>
          <th>平均回撤</th>
        </tr>
      </thead>

      <tbody id="etf-body">
        <tr>
          <td colspan="11" class="etf-loading">
            正在加载 ETF 数据...
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</div>

<script>

const DATA_URL = "{{ '/assets/data/etf_data.json' | relative_url }}";

/* 防止 ETF 名称中的特殊字符影响页面 */
function escapeHtml(value) {

  return String(value ?? '').replace(/[&<>"']/g, function (char) {

    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    };

    return map[char];

  });

}


/* 普通数字 */
function formatNumber(value, digits = 2) {

  if (
    value === null ||
    value === undefined ||
    value === '' ||
    Number.isNaN(Number(value))
  ) {
    return '--';
  }

  return Number(value).toFixed(digits);

}


/* 百分比 */
function formatPercent(value) {

  if (
    value === null ||
    value === undefined ||
    value === '' ||
    Number.isNaN(Number(value))
  ) {
    return '--';
  }

  const number = Number(value);

  if (number > 0) {

    return '<span class="up">+' +
      number.toFixed(2) +
      '%</span>';

  }

  if (number < 0) {

    return '<span class="down">' +
      number.toFixed(2) +
      '%</span>';

  }

  return '<span class="neutral">0.00%</span>';

}


/* 加载数据 */
fetch(DATA_URL + '?t=' + Date.now())

  .then(function(response) {

    if (!response.ok) {
      throw new Error('数据文件加载失败');
    }

    return response.json();

  })

  .then(function(json) {

    const updated = document.getElementById('etf-updated');

    updated.textContent =
      '数据更新时间：' +
      (json.updated_at || '--');


    const body = document.getElementById('etf-body');

    const data = Array.isArray(json.data)
      ? json.data
      : [];


    if (data.length === 0) {

      body.innerHTML =
        '<tr>' +
        '<td colspan="11" class="etf-error">' +
        '暂无 ETF 数据' +
        '</td>' +
        '</tr>';

      return;

    }


    body.innerHTML = data.map(function(item) {

      const errorClass = item.error
        ? ' class="error-row"'
        : '';


      return (

        '<tr' + errorClass + '>' +

          /* 当前回撤 */
          '<td>' +
            formatPercent(item.current_drawdown) +
          '</td>' +

          /* ETF代码 */
          '<td class="etf-code">' +
            escapeHtml(item.code) +
          '</td>' +

          /* ETF名称 */
          '<td class="etf-name">' +
            escapeHtml(item.name) +
          '</td>' +

          /* 最新价格 */
          '<td>' +
            formatNumber(item.price, 3) +
          '</td>' +

          /* 今日涨跌幅 */
          '<td>' +
            formatPercent(item.return_1d) +
          '</td>' +

          /* 近1周 */
          '<td>' +
            formatPercent(item.return_1w) +
          '</td>' +

          /* 近1月 */
          '<td>' +
            formatPercent(item.return_1m) +
          '</td>' +

          /* 最近最高点 */
          '<td>' +
            formatNumber(item.highest, 3) +
          '</td>' +

          /* 最近最低点 */
          '<td>' +
            formatNumber(item.lowest, 3) +
          '</td>' +

          /* 最大回撤 */
          '<td>' +
            formatPercent(item.max_drawdown) +
          '</td>' +

          /* 平均回撤 */
          '<td>' +
            formatPercent(item.avg_drawdown) +
          '</td>' +

        '</tr>'

      );

    }).join('');

  })

  .catch(function(error) {

    console.error(error);

    document.getElementById('etf-updated').textContent =
      '数据加载失败';

    document.getElementById('etf-body').innerHTML =

      '<tr>' +
        '<td colspan="11" class="etf-error">' +
          'ETF 数据加载失败，请稍后刷新页面' +
        '</td>' +
      '</tr>';

  });

</script>
