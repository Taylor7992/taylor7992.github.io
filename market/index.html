---
layout: single
title: "ETF 自选监控"
permalink: /market/
---

<style>
.etf-page {
  width: 100%;
  max-width: 1600px;
  margin: 0 auto;
  padding: 0 20px 40px;
  box-sizing: border-box;
}

.etf-title {
  margin-bottom: 8px;
}

.etf-desc {
  color: #777;
  margin-bottom: 20px;
}

.etf-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 15px;
  padding: 12px 16px;
  border-radius: 8px;
  background: #f5f5f5;
}

.etf-status-text {
  font-size: 14px;
}

.etf-update {
  font-size: 13px;
  color: #777;
}

.heatmap-box {
  margin: 20px 0 30px;
}

.heatmap-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.heatmap-title {
  font-size: 20px;
  font-weight: 700;
  margin: 0;
}

.heatmap-buttons {
  display: flex;
  gap: 6px;
}

.heatmap-btn {
  border: 1px solid #ccc;
  background: #fff;
  color: #333;
  border-radius: 5px;
  padding: 6px 14px;
  cursor: pointer;
  font-size: 14px;
}

.heatmap-btn:hover {
  background: #f0f0f0;
}

.heatmap-btn.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

.heatmap {
  width: 100%;
  height: 520px;
  display: flex;
  gap: 3px;
  overflow: hidden;
  border-radius: 8px;
  background: #eee;
}

.heatmap-column {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.heatmap-item {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
  overflow: hidden;
  cursor: pointer;
  box-sizing: border-box;
  padding: 5px;
  transition: filter 0.15s ease;
}

.heatmap-item:hover {
  filter: brightness(1.12);
  z-index: 2;
}

.heatmap-code {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
}

.heatmap-name {
  font-size: 12px;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.heatmap-percent {
  font-size: 13px;
  font-weight: 700;
  margin-top: 4px;
}

.heatmap-empty {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  background: #f5f5f5;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.etf-table {
  width: 100%;
  min-width: 1050px;
  border-collapse: collapse;
  margin: 0;
  font-size: 14px;
}

.etf-table th {
  position: relative;
  background: #f5f5f5;
  font-weight: 700;
  white-space: nowrap;
  padding: 11px 10px;
  border-bottom: 2px solid #ddd;
}

.etf-table td {
  padding: 10px;
  border-bottom: 1px solid #eee;
  white-space: nowrap;
  text-align: center;
}

.etf-table tbody tr:hover {
  background: #fafafa;
}

.sortable {
  cursor: pointer;
  user-select: none;
}

.sortable:hover {
  background: #eaeaea;
}

.sort-indicator {
  margin-left: 4px;
  font-size: 11px;
  color: #999;
}

.up {
  color: #d93025;
  font-weight: 600;
}

.down {
  color: #188038;
  font-weight: 600;
}

.neutral {
  color: #666;
}

.current-drawdown {
  font-weight: 600;
}

.loading {
  padding: 30px;
  text-align: center;
  color: #777;
}

.error {
  padding: 20px;
  text-align: center;
  color: #d93025;
  background: #fff5f5;
  border-radius: 8px;
}

@media (max-width: 768px) {
  .etf-page {
    padding: 0 10px 30px;
  }

  .heatmap {
    height: 420px;
  }

  .heatmap-code {
    font-size: 12px;
  }

  .heatmap-name {
    font-size: 10px;
  }

  .heatmap-percent {
    font-size: 11px;
  }

  .etf-table {
    font-size: 13px;
  }

  .etf-table th,
  .etf-table td {
    padding: 8px 7px;
  }
}
</style>

<div class="etf-page">

  <h1 class="etf-title">ETF 自选监控</h1>
  <div class="etf-desc">自动更新 ETF 行情、收益率与回撤数据</div>

  <div class="etf-status">
    <div class="etf-status-text" id="statusText">
      正在加载 ETF 数据...
    </div>
    <div class="etf-update" id="updateTime"></div>
  </div>

  <div class="heatmap-box">
    <div class="heatmap-header">
      <h2 class="heatmap-title">ETF 热力图</h2>

      <div class="heatmap-buttons">
        <button class="heatmap-btn active" data-period="change_1d">今日</button>
        <button class="heatmap-btn" data-period="change_1w">1周</button>
        <button class="heatmap-btn" data-period="change_1m">1月</button>
      </div>
    </div>

    <div id="heatmap" class="heatmap">
      <div class="heatmap-empty">正在加载...</div>
    </div>
  </div>

  <div class="table-wrap">
    <table class="etf-table">
      <thead>
        <tr>
          <th>当前回撤</th>
          <th>ETF代码</th>
          <th>ETF名称</th>
          <th>最新价格</th>

          <th class="sortable" data-sort="change_1d">
            今日涨跌幅
            <span class="sort-indicator" data-indicator="change_1d"></span>
          </th>

          <th class="sortable" data-sort="change_1w">
            近1周涨跌幅
            <span class="sort-indicator" data-indicator="change_1w"></span>
          </th>

          <th class="sortable" data-sort="change_1m">
            近1月涨跌幅
            <span class="sort-indicator" data-indicator="change_1m"></span>
          </th>

          <th>最近最高点</th>
          <th>最近最低点</th>
          <th>最大回撤</th>
          <th>平均回撤</th>
        </tr>
      </thead>

      <tbody id="etfTableBody">
        <tr>
          <td colspan="11" class="loading">正在加载 ETF 数据...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
(function () {
  const DATA_URL = "/assets/data/etf_data.json";

  let originalData = [];
  let currentSort = null;
  let sortDirection = "desc";
  let heatmapPeriod = "change_1d";

  function formatPercent(value) {
    if (value === null || value === undefined || value === "" || isNaN(value)) {
      return "--";
    }

    const num = Number(value);

    if (num > 0) {
      return "+" + num.toFixed(2) + "%";
    }

    return num.toFixed(2) + "%";
  }

  function formatNumber(value, decimals) {
    if (value === null || value === undefined || value === "" || isNaN(value)) {
      return "--";
    }

    return Number(value).toFixed(decimals);
  }

  function formatAmount(value) {
    if (value === null || value === undefined || value === "" || isNaN(value)) {
      return "--";
    }

    const num = Number(value);

    if (num >= 100000000) {
      return (num / 100000000).toFixed(2) + "亿";
    }

    if (num >= 10000) {
      return (num / 10000).toFixed(2) + "万";
    }

    return num.toFixed(0);
  }

  function escapeHTML(value) {
    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getChangeClass(value) {
    if (value === null || value === undefined || isNaN(value)) {
      return "neutral";
    }

    if (Number(value) > 0) {
      return "up";
    }

    if (Number(value) < 0) {
      return "down";
    }

    return "neutral";
  }

  function getHeatColor(value, maxAbs) {
    const num = Number(value);

    if (!isFinite(num) || num === 0) {
      return "rgb(150,150,150)";
    }

    const ratio = Math.min(Math.abs(num) / Math.max(maxAbs, 1), 1);

    if (num > 0) {
      const r = 150 + Math.round(80 * ratio);
      const g = 80 - Math.round(45 * ratio);
      const b = 80 - Math.round(45 * ratio);

      return "rgb(" + r + "," + g + "," + b + ")";
    }

    const r = 80 - Math.round(45 * ratio);
    const g = 150 + Math.round(80 * ratio);
    const b = 80 - Math.round(45 * ratio);

    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function getHeatmapValue(item) {
    const value = Number(item[heatmapPeriod]);
    return isFinite(value) ? value : 0;
  }

  function renderHeatmap(data) {
    const heatmap = document.getElementById("heatmap");

    if (!data || data.length === 0) {
      heatmap.innerHTML = '<div class="heatmap-empty">暂无数据</div>';
      return;
    }

    const items = data
      .filter(function (item) {
        return item && item.code;
      })
      .map(function (item) {
        return {
          data: item,
          amount: Number(item.amount) > 0 ? Number(item.amount) : 1,
          value: getHeatmapValue(item)
        };
      });

    if (items.length === 0) {
      heatmap.innerHTML = '<div class="heatmap-empty">暂无数据</div>';
      return;
    }

    const maxAbs = Math.max.apply(
      null,
      items.map(function (item) {
        return Math.abs(item.value);
      })
    );

    items.sort(function (a, b) {
      return b.amount - a.amount;
    });

    const columnCount = window.innerWidth <= 768 ? 3 : 5;
    const columns = [];

    for (let i = 0; i < columnCount; i++) {
      columns.push({
        items: [],
        total: 0
      });
    }

    items.forEach(function (item) {
      let target = columns[0];

      columns.forEach(function (column) {
        if (column.total < target.total) {
          target = column;
        }
      });

      target.items.push(item);
      target.total += item.amount;
    });

    const totalAmount = columns.reduce(function (sum, column) {
      return sum + column.total;
    }, 0);

    heatmap.innerHTML = "";

    columns.forEach(function (column) {
      if (column.items.length === 0) {
        return;
      }

      const columnDiv = document.createElement("div");
      columnDiv.className = "heatmap-column";

      const width = totalAmount > 0
        ? column.total / totalAmount * 100
        : 100 / columns.length;

      columnDiv.style.flex = "0 0 " + width + "%";

      column.items.forEach(function (item) {
        const div = document.createElement("div");
        div.className = "heatmap-item";

        const height = column.total > 0
          ? item.amount / column.total * 100
          : 100 / column.items.length;

        div.style.height = height + "%";
        div.style.background = getHeatColor(item.value, maxAbs);

        const dataItem = item.data;

        const code = dataItem.code || "--";
        const name = dataItem.name || "--";
        const amount = formatAmount(dataItem.amount);
        const today = formatPercent(dataItem.change_1d);
        const week = formatPercent(dataItem.change_1w);
        const month = formatPercent(dataItem.change_1m);
        const drawdown = formatPercent(dataItem.current_drawdown);

        div.title =
          name + "（" + code + "）\n" +
          "成交额：" + amount + "\n" +
          "今日：" + today + "\n" +
          "1周：" + week + "\n" +
          "1月：" + month + "\n" +
          "当前回撤：" + drawdown;

        div.innerHTML =
          '<div>' +
            '<div class="heatmap-code">' + escapeHTML(code) + '</div>' +
            '<div class="heatmap-name">' + escapeHTML(name) + '</div>' +
            '<div class="heatmap-percent">' + escapeHTML(formatPercent(item.value)) + '</div>' +
          '</div>';

        columnDiv.appendChild(div);
      });

      heatmap.appendChild(columnDiv);
    });
  }

  function sortData(data) {
    const result = data.slice();

    if (!currentSort) {
      return result;
    }

    result.sort(function (a, b) {
      const aValue = Number(a[currentSort]);
      const bValue = Number(b[currentSort]);

      if (isNaN(aValue)) return 1;
      if (isNaN(bValue)) return -1;

      return sortDirection === "asc"
        ? aValue - bValue
        : bValue - aValue;
    });

    return result;
  }

  function updateSortIndicators() {
    document.querySelectorAll(".sort-indicator").forEach(function (el) {
      el.textContent = "";
    });

    if (!currentSort) {
      return;
    }

    const indicator = document.querySelector(
      '[data-indicator="' + currentSort + '"]'
    );

    if (indicator) {
      indicator.textContent = sortDirection === "asc" ? "▲" : "▼";
    }
  }

  function renderTable(data) {
    const tbody = document.getElementById("etfTableBody");

    if (!data || data.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="11" class="loading">暂无 ETF 数据</td></tr>';
      return;
    }

    const sortedData = sortData(data);

    tbody.innerHTML = "";

    sortedData.forEach(function (item) {
      const tr = document.createElement("tr");

      const currentDrawdownClass =
        getChangeClass(item.current_drawdown);

      tr.innerHTML =
        '<td class="' + currentDrawdownClass + ' current-drawdown">' +
          formatPercent(item.current_drawdown) +
        '</td>' +

        '<td>' +
          escapeHTML(item.code || "--") +
        '</td>' +

        '<td>' +
          escapeHTML(item.name || "--") +
        '</td>' +

        '<td>' +
          formatNumber(item.price, 3) +
        '</td>' +

        '<td class="' + getChangeClass(item.change_1d) + '">' +
          formatPercent(item.change_1d) +
        '</td>' +

        '<td class="' + getChangeClass(item.change_1w) + '">' +
          formatPercent(item.change_1w) +
        '</td>' +

        '<td class="' + getChangeClass(item.change_1m) + '">' +
          formatPercent(item.change_1m) +
        '</td>' +

        '<td>' +
          formatNumber(item.recent_high, 3) +
        '</td>' +

        '<td>' +
          formatNumber(item.recent_low, 3) +
        '</td>' +

        '<td class="' + getChangeClass(item.max_drawdown) + '">' +
          formatPercent(item.max_drawdown) +
        '</td>' +

        '<td class="' + getChangeClass(item.average_drawdown) + '">' +
          formatPercent(item.average_drawdown) +
        '</td>';

      tbody.appendChild(tr);
    });

    updateSortIndicators();
  }

  function bindSortEvents() {
    document.querySelectorAll(".sortable").forEach(function (th) {
      th.addEventListener("click", function () {
        const sortKey = th.dataset.sort;

        if (currentSort === sortKey) {
          sortDirection =
            sortDirection === "desc" ? "asc" : "desc";
        } else {
          currentSort = sortKey;
          sortDirection = "desc";
        }

        renderTable(originalData);
      });
    });
  }

  function bindHeatmapEvents() {
    document.querySelectorAll(".heatmap-btn").forEach(function (button) {
      button.addEventListener("click", function () {
        document.querySelectorAll(".heatmap-btn").forEach(function (btn) {
          btn.classList.remove("active");
        });

        button.classList.add("active");
        heatmapPeriod = button.dataset.period;

        renderHeatmap(originalData);
      });
    });

    window.addEventListener("resize", function () {
      renderHeatmap(originalData);
    });
  }

  async function loadETFData() {
    const statusText = document.getElementById("statusText");
    const updateTime = document.getElementById("updateTime");

    try {
      const response = await fetch(
        DATA_URL + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const json = await response.json();

      let data = [];

      if (Array.isArray(json)) {
        data = json;
      } else if (Array.isArray(json.data)) {
        data = json.data;
      }

      if (data.length === 0) {
        throw new Error("数据为空");
      }

      originalData = data;

      renderHeatmap(originalData);
      renderTable(originalData);

      statusText.textContent =
        "数据加载成功，共 " + originalData.length + " 只 ETF";

      if (json.updated_at) {
        updateTime.textContent =
          "更新时间：" + json.updated_at;
      }

    } catch (error) {
      console.error(error);

      statusText.textContent = "ETF 数据加载失败";

      updateTime.textContent = "";

      document.getElementById("heatmap").innerHTML =
        '<div class="heatmap-empty">数据加载失败：' +
        escapeHTML(error.message) +
        "</div>";

      document.getElementById("etfTableBody").innerHTML =
        '<tr><td colspan="11" class="error">' +
        "数据加载失败：" +
        escapeHTML(error.message) +
        "<br><br>请检查 assets/data/etf_data.json" +
        "</td></tr>";
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    bindSortEvents();
    bindHeatmapEvents();
    loadETFData();
  });
})();
</script>
