```html
---

<style>

/* ================================
   ETF 监控页面
   Finviz 风格深色布局
   ================================ */

.etf-page {
  width: 100%;
  max-width: 1800px;
  margin: 0 auto;
  padding: 0 20px 40px;
  box-sizing: border-box;
  color: #e6e6e6;
}

/* 页面标题 */
.etf-title {
  margin-bottom: 6px;
  color: #ffffff;
}

.etf-desc {
  color: #999;
  margin-bottom: 18px;
}

/* ================================
   状态栏
   ================================ */

.etf-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;

  margin-bottom: 18px;
  padding: 11px 15px;

  background: #171717;
  border: 1px solid #292929;
  border-radius: 6px;
}

.etf-status-text {
  font-size: 13px;
  color: #bbb;
}

.etf-update {
  font-size: 12px;
  color: #777;
}

/* ================================
   主体：左热力图 + 右表格
   ================================ */

.market-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(620px, 1.25fr);
  gap: 14px;

  align-items: stretch;
}

/* 两边都是深色面板 */

.market-panel {
  background: #111;
  border: 1px solid #292929;
  border-radius: 6px;
  overflow: hidden;
}

/* ================================
   面板标题
   ================================ */

.panel-header {
  height: 52px;
  padding: 0 15px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid #292929;
  background: #151515;
}

.panel-title {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  color: #eee;
}

/* ================================
   周期按钮
   ================================ */

.heatmap-buttons {
  display: flex;
  gap: 5px;
}

.heatmap-btn {
  border: 1px solid #383838;

  color: #aaa;

  padding: 5px 12px;

.heatmap-btn:hover {
  background: #2b2b2b;

}

.heatmap-btn.active {
  background: #444;
  color: #fff;

}

/* ================================
   热力图
   ================================ */

.heatmap-box {
  height: 680px;
}

.heatmap {
  width: 100%;
  height: calc(100% - 53px);

  display: flex;
  gap: 2px;

  overflow: hidden;

  background: #080808;
}

.heatmap-column {
  height: 100%;

  display: flex;
  flex-direction: column;

  gap: 2px;

  min-width: 0;
}

.heatmap-item {
  position: relative;

  min-width: 0;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  color: #fff;

  overflow: hidden;
  cursor: pointer;

  box-sizing: border-box;

  padding: 5px;

  transition:
    filter 0.15s ease,
    transform 0.15s ease;
}

.heatmap-item:hover {
  filter: brightness(1.18);
  transform: scale(1.01);
  z-index: 5;
}

/* 热力图文字 */

.heatmap-code {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
}

.heatmap-name {

  margin-top: 3px;

}

.heatmap-percent {

  margin-top: 4px;
}

  align-items: center;

}

/* ================================

.table-panel {

}

.table-wrap {

  overflow-x: auto;

}

/* 滚动条 */

.table-wrap::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.table-wrap::-webkit-scrollbar-track {
  background: #111;
}

.table-wrap::-webkit-scrollbar-thumb {

  border-radius: 4px;
}

.table-wrap::-webkit-scrollbar-thumb:hover {

.etf-table {

  position: sticky;

  padding: 10px 9px;

.etf-table th:first-child,

  z-index: 2;

.etf-table th:first-child {

/* 排序 */

.sortable {

.sortable:hover {

.sort-indicator {

}

/* ================================
   涨跌颜色
   ================================ */

.up {

}

.down {
  color: #20c77a;

}

.neutral {

/* ================================

.loading {
  padding: 30px !important;

/* ================================

@media (max-width: 1100px) {

    grid-template-columns: 1fr;
  }

@media (max-width: 768px) {

  .heatmap-code {

  }

<script>

(function () {

  /* ETF 数据地址 */

  const DATA_URL = "/assets/data/etf_data.json";


  /* 当前状态 */

  let originalData = [];

  let currentSort = null;

  let sortDirection = "desc";

  let heatmapPeriod = "change_1d";


  /* ================================
     数字格式
     ================================ */

  function formatPercent(value) {

    if (
      value === null ||
      value === undefined ||
      value === "" ||
      isNaN(value)
    ) {
      return "--";
    }

    const num = Number(value);

    if (num > 0) {
      return "+" + num.toFixed(2) + "%";
    }

    return num.toFixed(2) + "%";
  }


  function formatNumber(value, decimals) {

    if (
      value === null ||
      value === undefined ||
      value === "" ||
      isNaN(value)
    ) {
      return "--";
    }

    return Number(value).toFixed(decimals);
  }


  /* 成交额显示 */

  function formatAmount(value) {

    if (
      value === null ||
      value === undefined ||
      value === "" ||
      isNaN(value)
    ) {
      return "--";
    }

    const num = Number(value);

    if (num >= 100000000) {
      return (num / 100000000).toFixed(2) + "亿";
    }

    if (num >= 10000) {
      return (num / 10000).toFixed(2) + "万";
    }

    return num.toFixed(0);
  }


  /* 防止名称中的特殊字符影响网页 */

  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ================================
     判断涨跌颜色
     ================================ */

  function getChangeClass(value) {

    if (
      value === null ||
      value === undefined ||
      isNaN(value)
    ) {
      return "neutral";
    }

    if (Number(value) > 0) {
      return "up";
    }

    if (Number(value) < 0) {
      return "down";
    }

    return "neutral";
  }


  /* ================================
     热力图颜色
     红 = 上涨
     绿 = 下跌
     ================================ */

  function getHeatColor(value, maxAbs) {

    const num = Number(value);

    if (!isFinite(num) || num === 0) {
      return "rgb(90,90,90)";
    }

    const ratio = Math.min(
      Math.abs(num) / Math.max(maxAbs, 1),
      1
    );


    /* 上涨：深红 → 亮红 */

    if (num > 0) {

      const r = 120 + Math.round(120 * ratio);

      const g = 45 - Math.round(25 * ratio);

      const b = 45 - Math.round(25 * ratio);

      return "rgb(" + r + "," + g + "," + b + ")";
    }


    /* 下跌：深绿 → 亮绿 */

    const r = 35 - Math.round(15 * ratio);

    const g = 120 + Math.round(100 * ratio);

    const b = 65 - Math.round(25 * ratio);

    return "rgb(" + r + "," + g + "," + b + ")";
  }


  /* 获取当前热力图周期 */

  function getHeatmapValue(item) {

    const value = Number(
      item[heatmapPeriod]
    );

    return isFinite(value) ? value : 0;
  }


  /* ================================
     绘制热力图
     面积 = 成交额
     颜色 = 涨跌幅
     ================================ */

  function renderHeatmap(data) {

    const heatmap =
      document.getElementById("heatmap");


    if (!data || data.length === 0) {

      heatmap.innerHTML =
        '<div class="heatmap-empty">暂无数据</div>';

      return;
    }


    const items = data

      .filter(function (item) {

        return item && item.code;

      })

      .map(function (item) {

        const amount =
          Number(item.amount);


        return {

          data: item,

          /* 有成交额就使用成交额 */

          amount:
            isFinite(amount) && amount > 0
              ? amount
              : 1,

          value:
            getHeatmapValue(item)

        };

      });


    if (items.length === 0) {

      heatmap.innerHTML =
        '<div class="heatmap-empty">暂无数据</div>';

      return;
    }


    /* 找到最大涨跌幅 */

    const maxAbs =
      Math.max.apply(
        null,
        items.map(function (item) {

          return Math.abs(item.value);

        })
      );


    /* 成交额最大的 ETF 放前面 */

    items.sort(function (a, b) {

      return b.amount - a.amount;

    });


    /* 电脑 5 列，手机 3 列 */

    const columnCount =
      window.innerWidth <= 768
        ? 3
        : 5;


    const columns = [];


    for (
      let i = 0;
      i < columnCount;
      i++
    ) {

      columns.push({

        items: [],

        total: 0

      });

    }


    /* 尽量平均分配成交额 */

    items.forEach(function (item) {

      let target =
        columns[0];


      columns.forEach(function (column) {

        if (
          column.total <
          target.total
        ) {

          target = column;

        }

      });


      target.items.push(item);

      target.total += item.amount;

    });


    const totalAmount =
      columns.reduce(
        function (sum, column) {

          return sum + column.total;

        },
        0
      );


    heatmap.innerHTML = "";


    /* 创建热力图 */

    columns.forEach(function (column) {

      if (
        column.items.length === 0
      ) {

        return;

      }


      const columnDiv =
        document.createElement("div");

      columnDiv.className =
        "heatmap-column";


      const width =
        totalAmount > 0

          ? (
              column.total /
              totalAmount *
              100
            )

          : (
              100 /
              columns.length
            );


      columnDiv.style.flex =
        "0 0 " + width + "%";


      column.items.forEach(
        function (item) {

          const div =
            document.createElement("div");


          div.className =
            "heatmap-item";


          /* ETF 成交额决定高度 */

          const height =
            column.total > 0

              ? (
                  item.amount /
                  column.total *
                  100
                )

              : (
                  100 /
                  column.items.length
                );


          div.style.height =
            height + "%";


          /* ETF 涨跌决定颜色 */

          div.style.background =
            getHeatColor(
              item.value,
              maxAbs
            );


          const dataItem =
            item.data;


          const code =
            dataItem.code || "--";

          const name =
            dataItem.name || "--";

          const amount =
            formatAmount(
              dataItem.amount
            );

          const today =
            formatPercent(
              dataItem.change_1d
            );

          const week =
            formatPercent(
              dataItem.change_1w
            );

          const month =
            formatPercent(
              dataItem.change_1m
            );

          const drawdown =
            formatPercent(
              dataItem.current_drawdown
            );


          /* 鼠标悬停详细信息 */

          div.title =

            name +
            "（" +
            code +
            "）\n" +

            "成交额：" +
            amount +
            "\n" +

            "今日：" +
            today +
            "\n" +

            "1周：" +
            week +
            "\n" +

            "1月：" +
            month +
            "\n" +

            "当前回撤：" +
            drawdown;


          div.innerHTML =

            "<div>" +

              '<div class="heatmap-code">' +
                escapeHTML(code) +
              "</div>" +

              '<div class="heatmap-name">' +
                escapeHTML(name) +
              "</div>" +

              '<div class="heatmap-percent">' +
                escapeHTML(
                  formatPercent(
                    item.value
                  )
                ) +
              "</div>" +

            "</div>";


          columnDiv.appendChild(div);

        }
      );


      heatmap.appendChild(
        columnDiv
      );

    });

  }


  /* ================================
     表格排序
     ================================ */

  function sortData(data) {

    const result =
      data.slice();


    if (!currentSort) {

      return result;

    }


    result.sort(function (a, b) {

      const aValue =
        Number(
          a[currentSort]
        );

      const bValue =
        Number(
          b[currentSort]
        );


      if (isNaN(aValue)) {
        return 1;
      }

      if (isNaN(bValue)) {
        return -1;
      }


      return sortDirection === "asc"

        ? aValue - bValue

        : bValue - aValue;

    });


    return result;

  }


  /* 更新排序箭头 */

  function updateSortIndicators() {

    document
      .querySelectorAll(
        ".sort-indicator"
      )
      .forEach(
        function (el) {

          el.textContent = "";

        }
      );


    if (!currentSort) {

      return;

    }


    const indicator =
      document.querySelector(
        '[data-indicator="' +
        currentSort +
        '"]'
      );


    if (indicator) {

      indicator.textContent =
        sortDirection === "asc"
          ? "▲"
          : "▼";

    }

  }


  /* ================================
     绘制数据表
     ================================ */

  function renderTable(data) {

    const tbody =
      document.getElementById(
        "etfTableBody"
      );


    if (!data || data.length === 0) {

      tbody.innerHTML =

        '<tr>' +

          '<td colspan="11" class="loading">' +

            "暂无 ETF 数据" +

          "</td>" +

        "</tr>";

      return;

    }


    const sortedData =
      sortData(data);


    tbody.innerHTML = "";


    sortedData.forEach(
      function (item) {

        const tr =
          document.createElement("tr");


        const currentDrawdownClass =
          getChangeClass(
            item.current_drawdown
          );


        tr.innerHTML =

          /* 当前回撤 */

          '<td class="' +
            currentDrawdownClass +
            ' current-drawdown">' +

            formatPercent(
              item.current_drawdown
            ) +

          "</td>" +


          /* ETF代码 */

          "<td>" +

            escapeHTML(
              item.code || "--"
            ) +

          "</td>" +


          /* ETF名称 */

          "<td>" +

            escapeHTML(
              item.name || "--"
            ) +

          "</td>" +


          /* 最新价格 */

          "<td>" +

            formatNumber(
              item.price,
              3
            ) +

          "</td>" +


          /* 今日 */

          '<td class="' +
            getChangeClass(
              item.change_1d
            ) +
          '">' +

            formatPercent(
              item.change_1d
            ) +

          "</td>" +


          /* 1周 */

          '<td class="' +
            getChangeClass(
              item.change_1w
            ) +
          '">' +

            formatPercent(
              item.change_1w
            ) +

          "</td>" +


          /* 1月 */

          '<td class="' +
            getChangeClass(
              item.change_1m
            ) +
          '">' +

            formatPercent(
              item.change_1m
            ) +

          "</td>" +


          /* 最近最高点 */

          "<td>" +

            formatNumber(
              item.recent_high,
              3
            ) +

          "</td>" +


          /* 最近最低点 */

          "<td>" +

            formatNumber(
              item.recent_low,
              3
            ) +

          "</td>" +


          /* 最大回撤 */

          '<td class="' +
            getChangeClass(
              item.max_drawdown
            ) +
          '">' +

            formatPercent(
              item.max_drawdown
            ) +

          "</td>" +


          /* 平均回撤 */

          '<td class="' +
            getChangeClass(
              item.average_drawdown
            ) +
          '">' +

            formatPercent(
              item.average_drawdown
            ) +

          "</td>";


        tbody.appendChild(tr);

      }
    );


    updateSortIndicators();

  }


  /* ================================
     排序按钮
     ================================ */

  function bindSortEvents() {

    document
      .querySelectorAll(
        ".sortable"
      )
      .forEach(
        function (th) {

          th.addEventListener(
            "click",
            function () {

              const sortKey =
                th.dataset.sort;


              if (
                currentSort ===
                sortKey
              ) {

                sortDirection =
                  sortDirection ===
                  "desc"
                    ? "asc"
                    : "desc";

              } else {

                currentSort =
                  sortKey;

                sortDirection =
                  "desc";

              }


              renderTable(
                originalData
              );

            }
          );

        }
      );

  }


  /* ================================
     热力图周期按钮
     ================================ */

  function bindHeatmapEvents() {

    document
      .querySelectorAll(
        ".heatmap-btn"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function () {


              document
                .querySelectorAll(
                  ".heatmap-btn"
                )
                .forEach(
                  function (btn) {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


              button.classList.add(
                "active"
              );


              heatmapPeriod =
                button.dataset.period;


              renderHeatmap(
                originalData
              );

            }
          );

        }
      );


    /* 浏览器大小改变时重新排列 */

    window.addEventListener(
      "resize",
      function () {

        renderHeatmap(
          originalData
        );

      }
    );

  }


  /* ================================
     加载 ETF 数据
     ================================ */

  async function loadETFData() {

    const statusText =
      document.getElementById(
        "statusText"
      );


    const updateTime =
      document.getElementById(
        "updateTime"
      );


    try {

      const response =
        await fetch(

          DATA_URL +
          "?t=" +
          Date.now(),

          {
            cache: "no-store"
          }

        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const json =
        await response.json();


      let data = [];


      if (
        Array.isArray(json)
      ) {

        data = json;

      } else if (
        Array.isArray(
          json.data
        )
      ) {

        data = json.data;

      }


      if (
        data.length === 0
      ) {

        throw new Error(
          "数据为空"
        );

      }


      originalData =
        data;


      /* 绘制页面 */

      renderHeatmap(
        originalData
      );


      renderTable(
        originalData
      );


      /* 状态 */

      statusText.textContent =
        "数据加载成功，共 " +
        originalData.length +
        " 只 ETF";


      if (
        json.updated_at
      ) {

        updateTime.textContent =
          "更新时间：" +
          json.updated_at;

      }

    }


    catch (error) {

      console.error(error);


      statusText.textContent =
        "ETF 数据加载失败";


      updateTime.textContent =
        "";


      document.getElementById(
        "heatmap"
      ).innerHTML =

        '<div class="heatmap-empty">' +

          "数据加载失败：" +

          escapeHTML(
            error.message
          ) +

        "</div>";


      document.getElementById(
        "etfTableBody"
      ).innerHTML =

        '<tr>' +

          '<td colspan="11" class="error">' +

            "数据加载失败：" +

            escapeHTML(
              error.message
            ) +

            "<br><br>" +

            "请检查 assets/data/etf_data.json" +

          "</td>" +

        "</tr>";

    }

  }


  /* ================================
     页面启动
     ================================ */

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      bindSortEvents();

      bindHeatmapEvents();

      loadETFData();

    }
  );

})();

</script>
