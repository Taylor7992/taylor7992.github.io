<div class="etf-page">

  <!-- =====================================================
       页面标题

  <div class="etf-header">

    <h1>ETF 自选监控</h1>

    <div class="etf-subtitle">
      自动更新 ETF 行情、收益率与回撤数据
    </div>

  </div>


  <!-- =====================================================
       数据状态
       ===================================================== -->

  <div id="status" class="etf-status">
    正在加载数据……
  </div>


  <!-- =====================================================
       ETF 表格
       ===================================================== -->

  <div class="table-wrapper">

    <table class="etf-table">

      <thead>

        <tr>

          <th>
            当前回撤
          </th>

          <th>
            ETF代码
          </th>

          <th>
            ETF名称
          </th>

          <th>
            最新价格
          </th>


          <!-- 今日涨跌幅：可排序 -->

          <th
            class="sortable"
            data-sort="change_1d"
            title="点击排序"
          >
            今日涨跌幅<span class="sort-arrow"></span>
          </th>


          <!-- 近1周涨跌幅：可排序 -->

          <th
            class="sortable"
            data-sort="change_1w"
            title="点击排序"
          >
            近1周涨跌幅<span class="sort-arrow"></span>
          </th>


          <!-- 近1月涨跌幅：可排序 -->

          <th
            class="sortable"
            data-sort="change_1m"
            title="点击排序"
          >
            近1月涨跌幅<span class="sort-arrow"></span>
          </th>


          <th>
            最近最高点
          </th>

          <th>
            最近最低点
          </th>

          <th>
            最大回撤
          </th>

          <th>
            平均回撤
          </th>

        </tr>

      </thead>


      <tbody id="etf-body">

        <tr>

          <td
            colspan="11"
            class="loading"
          >
            正在加载 ETF 数据……
          </td>

        </tr>

      </tbody>

  </div>


  <!-- =====================================================

<script>

/* =========================================================
   1. 数据地址
   ========================================================= */

const DATA_URL =
  "{{ '/assets/data/etf_data.json' | relative_url }}";


/* =========================================================
   2. 排序状态
   ========================================================= */

let currentSort = {

  key: null,

  direction: "desc"

};


/* =========================================================
   3. 保存原始数据
   ========================================================= */

let originalData = [];


/* =========================================================
   4. 百分比格式化
   ========================================================= */

function formatPercent(value) {

  if (
    value === null ||
    value === undefined ||
    isNaN(value)
  ) {

    return "--";

  }


  const num = Number(value);


  if (num > 0) {

    return `
      <span class="positive">
        +${num.toFixed(2)}%
      </span>
    `;

  }


  if (num < 0) {

    return `
      <span class="negative">
        ${num.toFixed(2)}%
      </span>
    `;

  }


  return `
    <span class="zero">
      0.00%
    </span>
  `;

}


/* =========================================================
   5. 数字格式化
   ========================================================= */

function formatNumber(value, digits = 3) {

  if (
    value === null ||
    value === undefined ||
    isNaN(value)
  ) {

    return "--";

  }


  return Number(value).toFixed(digits);

}


/* =========================================================
   6. 排序数据
   ========================================================= */

function sortData(data, key) {

  /*
   * 如果点击的是当前排序列
   * 就切换升序 / 降序
   */

  if (currentSort.key === key) {

    currentSort.direction =
      currentSort.direction === "desc"
        ? "asc"
        : "desc";

  }

  /*
   * 第一次点击新的列
   * 默认从高到低
   */

  else {

    currentSort.key = key;

    currentSort.direction = "desc";

  }


  const direction =
    currentSort.direction;


  return [...data].sort((a, b) => {

    let valueA = Number(a[key]);

    let valueB = Number(b[key]);


    /*
     * 没有数据的 ETF 放到最后
     */

    if (isNaN(valueA) && isNaN(valueB)) {

      return 0;

    }


    if (isNaN(valueA)) {

      return 1;

    }


    if (isNaN(valueB)) {

      return -1;

    }


    /*
     * 降序
     */

    if (direction === "desc") {

      return valueB - valueA;

    }


    /*
     * 升序
     */

    return valueA - valueB;

  });

}


/* =========================================================
   7. 更新排序箭头
   ========================================================= */

function updateSortIndicators() {

  document
    .querySelectorAll(".sortable")
    .forEach(th => {

      const key =
        th.dataset.sort;


      const arrow =
        th.querySelector(".sort-arrow");


      /*
       * 清除箭头
       */

      arrow.textContent = "";


      /*
       * 当前排序列显示箭头
       */

      if (currentSort.key === key) {

        if (
          currentSort.direction === "desc"
        ) {

          arrow.textContent = " ↓";

        }

        else {

          arrow.textContent = " ↑";

        }

      }

    });

}


/* =========================================================
   8. 渲染表格
   ========================================================= */

function renderTable(data) {

  const tbody =
    document.getElementById("etf-body");


  /*
   * 没有数据
   */

  if (
    !data ||
    data.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="11"
          class="error"
        >
          暂无 ETF 数据
        </td>
      </tr>
    `;

    return;

  }


  /*
   * 生成 ETF 行
   */

  tbody.innerHTML = data.map(item => `

    <tr>

      <!-- 当前回撤 -->

      <td>
        ${formatPercent(item.current_drawdown)}
      </td>


      <!-- ETF代码 -->

      <td class="etf-code">
        ${item.code || "--"}
      </td>


      <!-- ETF名称 -->

      <td class="etf-name">
        ${item.name || "--"}
      </td>


      <!-- 最新价格 -->

      <td class="price">
        ${formatNumber(item.price, 3)}
      </td>


      <!-- 今日涨跌幅 -->

      <td>
        ${formatPercent(item.change_1d)}
      </td>


      <!-- 近1周涨跌幅 -->

      <td>
        ${formatPercent(item.change_1w)}
      </td>


      <!-- 近1月涨跌幅 -->

      <td>
        ${formatPercent(item.change_1m)}
      </td>


      <!-- 最近最高点 -->

      <td>
        ${formatNumber(item.recent_high, 3)}
      </td>


      <!-- 最近最低点 -->

      <td>
        ${formatNumber(item.recent_low, 3)}
      </td>


      <!-- 最大回撤 -->

      <td>
        ${formatPercent(item.max_drawdown)}
      </td>


      <!-- 平均回撤 -->

      <td>
        ${formatPercent(item.average_drawdown)}
      </td>

    </tr>

  `).join("");


  /*
   * 更新排序箭头
   */

  updateSortIndicators();

}


/* =========================================================
   9. 加载 ETF 数据
   ========================================================= */

async function loadETFData() {

  const status =
    document.getElementById("status");


  const updateInfo =
    document.getElementById("update-info");


  try {

    /*
     * 加载提示
     */

    status.textContent =
      "正在加载 ETF 数据……";


    /*
     * 请求 JSON
     *
     * 加时间戳避免浏览器缓存
     */

    const response =
      await fetch(
        DATA_URL + "?t=" + Date.now()
      );


    /*
     * HTTP 错误
     */

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    /*
     * 解析 JSON
     */

    const json =
      await response.json();


    /*
     * 检查数据格式
     */

    if (
      !json.data ||
      !Array.isArray(json.data)
    ) {

      throw new Error(
        "JSON 数据格式不正确"
      );

    }


    /*
     * 保存原始数据
     */

    originalData =
      json.data;


    /*
     * 默认按照 JSON 原始顺序显示
     */

    renderTable(originalData);


    /*
     * 统计信息
     */

    const success =
      json.success ??
      json.data.length;


    const failed =
      json.failed ??
      0;


    status.innerHTML = `

      共监控
      <strong>
        ${json.count ?? json.data.length}
      </strong>
      只 ETF，

      成功
      <strong>
        ${success}
      </strong>
      只，

      失败
      <strong>
        ${failed}
      </strong>
      只

    `;


    /*
     * 更新时间
     */

    if (json.updated_at) {

      updateInfo.textContent =
        "数据更新时间：" +
        json.updated_at +
        "　数据来源：" +
        (
          json.source ||
          "Tencent Finance"
        );

    }

    else {

      updateInfo.textContent =
        "数据来源：" +
        (
          json.source ||
          "Tencent Finance"
        );

    }

  }


  catch (error) {

    /*
     * 控制台记录错误
     */

    console.error(
      "ETF 数据加载失败：",
      error
    );


    /*
     * 页面提示
     */

    status.textContent =
      "ETF 数据加载失败";


    document
      .getElementById("etf-body")
      .innerHTML = `

        <tr>

          <td
            colspan="11"
            class="error"
          >

            数据加载失败：
            ${error.message}

          </td>

        </tr>

      `;


    updateInfo.textContent =
      "请检查 assets/data/etf_data.json 是否正常生成。";

  }

}


/* =========================================================
   10. 绑定排序按钮
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {


    /*
     * 找到所有可以排序的表头
     */

    document
      .querySelectorAll(".sortable")
      .forEach(th => {


        /*
         * 点击表头
         */

        th.addEventListener(
          "click",
          () => {


            const key =
              th.dataset.sort;


            /*
             * 根据当前列排序
             */

            const sortedData =
              sortData(
                originalData,
                key
              );


            /*
             * 重新渲染表格
             */

            renderTable(
              sortedData
            );

          }
        );

      });


    /*
     * 加载数据
     */

    loadETFData();

  }
);

</script>
